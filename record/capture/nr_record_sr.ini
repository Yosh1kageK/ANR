; nr-record's SR and RR capture DLL (record/capture/README.md), in OptiScaler/custom/nr-record/dlss/. Keys by name (F1
; to F24) or as 0x code; empty disables.
record_key = F6
capture_key = F9
capture_frames = 8
; empty: ~/.local/share/nr-record under Proton ($XDG_DATA_HOME/nr-record if set), %LOCALAPPDATA%\nr-record on Windows
record_dir =
; 1: also record the upscaler's output (role output) after its call
record_output = 1
record_max_seconds = 300
record_free_gb = 50
record_ring = 4
record_threads = 0
record_queue_mb = 1024
record_zstd_level = 0
; What upscales the frames while nr-record is the upscaler picked in OptiScaler's menu, recording or not: nvidia
; (NVIDIA's DLSS and DLSS-RR through NVIDIA's NGX core), ffx (AMD's FSR through the FidelityFX API, any GPU), xess
; (Intel's XeSS through libxess.dll, any GPU), a path to another DLL with NGX's D3D12 exports (absolute or relative to
; this folder), or auto: the upscaler OptiScaler.ini names (Dx12Upscaler, as last saved), else nvidia where NVIDIA's
; NGX core is installed, else ffx. Ray reconstruction always goes to nvidia.
forward = auto
; A folder with NVIDIA's nvngx_dlss.dll and nvngx_dlssd.dll, if NGX does not find them (forward = nvidia)
nvidia_dlss =
; AMD's FidelityFX DLL for forward = ffx: amd_fidelityfx_dx12.dll (FSR 3.1, one DLL; a loader with separate providers
; does not work inside OptiScaler). Empty: amd\nr_record_ffx_dx12.dll (the package's), else amd_fidelityfx_dx12.dll
; in this folder, OptiScaler's folder or the game's.
ffx_dll =
; Intel's libxess.dll for forward = xess. Empty: libxess.dll in this folder, OptiScaler's folder or the game's
xess_dll =
