; nr-record's capture DLL (record/capture/README.md). Keys by name (F1 to F24) or as 0x code; empty disables.
record_key = F6
capture_key = F9
capture_frames = 8
; empty: ~/.local/share/nr-record under Proton ($XDG_DATA_HOME/nr-record if set), %LOCALAPPDATA%\nr-record on Windows
record_dir =
; interleaved: videos of real and generated frames; generated: generated frames only
record_mode = interleaved
; bypass: only real frames are shown while recording; keep: the forward DLL generates frames while recording
record_present = bypass
record_max_seconds = 300
record_free_gb = 50
record_ring = 4
record_threads = 0
record_queue_mb = 1024
record_zstd_level = 0
; What generates the frames when not recording: another DLL with DLSS-G's NGX exports (a path, absolute or relative
; to this folder, for example a frame generation provider's nvngx_dlssg.dll), or nvidia (NVIDIA's DLSS-G through
; NVIDIA's NGX core, which finds nvngx_dlssg.dll in the game's folder or nvidia_dlssg's). Empty: only real frames.
forward =
; NVIDIA's nvngx_dlssg.dll, if not in the game's folder (forward = nvidia, when this DLL starts NVIDIA's NGX core)
nvidia_dlssg =
; The highest multiplier minus 1 offered without a forward DLL.
max_generated = 5
